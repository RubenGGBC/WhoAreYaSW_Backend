<!-- Añadido: script de gestión de autenticación copiado de public/index.html raíz -->
<script>
    // Gestión de autenticación en la barra de navegación para botones de registro/inicio de sesión/cierre de sesión (ayuda de Copilot)
    (function authNavbar() {
        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const logoutBtn = document.getElementById('logoutBtn');
        const userGreeting = document.getElementById('userGreeting');
        const adminPanelLink = document.getElementById('adminPanelLink');

        const normalizeRole = (role) => (role || '').toString().trim().toLowerCase();

        const setGreeting = (name) => {
            if (!userGreeting) return;
            if (!name) {
                userGreeting.textContent = '';
                userGreeting.style.display = 'none';
                return;
            }
            userGreeting.textContent = `Hola, ${name}`;
            userGreeting.style.display = '';
        };

        const setAdminUI = (role) => {
            const isAdmin = normalizeRole(role) === 'admin';
            if (adminPanelLink) adminPanelLink.style.display = isAdmin ? '' : 'none';
        };

        const setLoggedInUI = (isLoggedIn, role = null) => {
            if (loginLink) loginLink.style.display = isLoggedIn ? 'none' : '';
            if (registerLink) registerLink.style.display = isLoggedIn ? 'none' : '';
            if (logoutBtn) logoutBtn.style.display = isLoggedIn ? '' : 'none';
            if (!isLoggedIn) {
                setGreeting(null);
                setAdminUI(null);
            } else {
                setAdminUI(role);
            }
        };

        // Estado inicial rápido (para evitar parpadeo)
        const cachedRole = localStorage.getItem('userRole');
        const cachedName = localStorage.getItem('userName');
        setLoggedInUI(!!cachedRole, cachedRole);
        if (cachedRole && cachedName) setGreeting(cachedName);

        const refreshFromServer = async () => {
            try {
                // Incluir token JWT si existe en localStorage
                const token = localStorage.getItem('authToken');
                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const res = await fetch('/current-user', {
                    credentials: 'same-origin',
                    headers: headers
                });

                if (!res.ok) {
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('authToken');
                    setLoggedInUI(false);
                    return;
                }
                const json = await res.json();
                const user = json && json.success ? json.data : null;
                if (!user) {
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('authToken');
                    setLoggedInUI(false);
                    return;
                }

                // Hay sesión
                if (user.role) localStorage.setItem('userRole', user.role);
                if (user.name) {
                    localStorage.setItem('userName', user.name);
                    setGreeting(user.name);
                }
                setLoggedInUI(true, user.role);
            } catch (e) {
                // Si falla, nos quedamos con el estado del cache
                setLoggedInUI(!!cachedRole, cachedRole);
                if (cachedRole && cachedName) setGreeting(cachedName);
            }
        };

        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                logoutBtn.disabled = true;
                const prevText = logoutBtn.textContent;
                logoutBtn.textContent = 'Cerrando...';

                try {
                    const token = localStorage.getItem('authToken');
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

                    const res = await fetch('/logout', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: headers
                    });

                    // Aunque falle, limpiamos estado del cliente y refrescamos
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('authToken');
                    setLoggedInUI(false);

                    // Si el backend responde ok, recargamos para dejar todo limpio
                    if (res.ok) {
                        window.location.reload();
                    } else {
                        // fallback
                        await refreshFromServer();
                    }
                } catch (e) {
                    localStorage.removeItem('userName');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('authToken');
                    setLoggedInUI(false);
                } finally {
                    logoutBtn.disabled = false;
                    logoutBtn.textContent = prevText;
                }
            });
        }

        // Verificar sesión real
        refreshFromServer();
    })();
</script>
